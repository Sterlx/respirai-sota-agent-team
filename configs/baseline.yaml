project:
  name: "RespirAI ICBHI2017 Baseline"
  split: "official_60_40"
  task: "lung_sound_classification"

data:
  data_dir: "${ICBHI2017_ROOT}"
  split_file: "data/official_split.txt"
  use_preprocessed: false

audio:
  sample_rate: 16000
  duration_seconds: 5
  n_mels: 64
  fmin: 50
  fmax: 2000

training:
  seed: 42
  batch_size: 16
  epochs: 5
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 2
  device: "cuda"
  use_amp: true

model:
  name: "cnn_baseline"
  num_classes: 4

labels:
  - normal
  - crackle
  - wheeze
  - both