project:
  name: "RespirAI Phase 4 Multi-Label Tuned"
  split: "official_60_40"
  task: "lung_sound_classification"

data:
  data_dir: "data"
  split_file: "data/official_split.txt"
  use_cycle_labels: true
  cycle_fixed_length_seconds: 5.0

audio:
  sample_rate: 4000
  n_fft: 512
  hop_length: 128
  n_mels: 64
  fmin: 50
  fmax: 2000
  max_time_frames: 160
  augmentation: true

training:
  seed: 42
  batch_size: 8
  epochs: 50
  learning_rate: 0.0005
  weight_decay: 0.0001
  num_workers: 0
  device: "cuda"
  use_amp: true
  gradient_accumulation_steps: 1
  early_stopping_patience: 10
  early_stopping_min_epochs: 15
  use_class_weights: true
  wheeze_pos_weight: 6.0
  crackles_threshold: 0.5
  wheezes_threshold: 0.3
  checkpoint_dir: "checkpoints"
  save_period: 5
  experiment_log: "experiments.jsonl"

model:
  name: "crnn"
  num_classes: 2
  gru_hidden: 128
  gru_layers: 2
  dropout: 0.2

labels:
  - normal
  - crackle
  - wheeze
  - both