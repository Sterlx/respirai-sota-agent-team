project:
  name: "RespirAI ICBHI2017 CRNN"
  split: "official_60_40"
  task: "lung_sound_classification"

data:
  data_dir: "data"
  split_file: "data/official_split.txt"

audio:
  sample_rate: 4000
  n_fft: 256
  hop_length: 64
  n_mels: 32
  fmin: 50
  fmax: 2000
  max_time_frames: 500
  augmentation: false

training:
  seed: 42
  batch_size: 16
  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 0
  device: "cuda"
  use_amp: true
  gradient_accumulation_steps: 1
  early_stopping_patience: 10
  use_class_weights: true
  checkpoint_dir: "checkpoints"
  save_period: 5
  experiment_log: "experiments.jsonl"

model:
  name: "crnn"
  num_classes: 4
  gru_hidden: 128
  gru_layers: 2
  dropout: 0.3

labels:
  - normal
  - crackle
  - wheeze
  - both