project:
  name: "RespirAI AST Pre-Trained"
  split: "official_60_40"
  task: "lung_sound_classification"

data:
  data_dir: "data"
  split_file: "data/official_split.txt"
  use_cycle_labels: true
  cycle_fixed_length_seconds: 5.0

audio:
  sample_rate: 16000
  n_fft: 400
  hop_length: 160
  n_mels: 128
  fmin: 50
  fmax: 8000
  max_time_frames: 1024
  augmentation: true

training:
  seed: 42
  batch_size: 4
  epochs: 50
  learning_rate: 0.00005
  weight_decay: 0.0001
  num_workers: 0
  device: "cuda"
  use_amp: true
  gradient_accumulation_steps: 1
  early_stopping_patience: 10
  early_stopping_min_epochs: 10
  use_class_weights: true
  wheeze_pos_weight: 6.0
  crackles_threshold: 0.5
  wheezes_threshold: 0.3
  checkpoint_dir: "checkpoints"
  save_period: 5
  experiment_log: "experiments.jsonl"

model:
  name: "ast"
  num_classes: 2
  pretrained: true
  dropout: 0.3

labels:
  - normal
  - crackle
  - wheeze
  - both