project:
  name: "RespirAI ICBHI2017 Baseline"
  split: "official_60_40"
  task: "lung_sound_classification"

data:
  data_dir: "data"
  split_file: "data/official_split.txt"

audio:
  sample_rate: 4000
  n_fft: 256
  hop_length: 64
  n_mels: 32
  fmin: 50
  fmax: 2000

training:
  seed: 42
  batch_size: 16
  epochs: 5
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 0
  device: "cuda"
  use_amp: true

model:
  name: "cnn_baseline"
  num_classes: 4

labels:
  - normal
  - crackle
  - wheeze
  - both